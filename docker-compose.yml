services:
  postgres:
    image: postgres
    container_name: epi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "pcodes"
      POSTGRES_PASSWORD: "pcodes"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    networks:
      - epi_network
  maildev:
    container_name: epi_mail_dev
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
networks:
  epi_network:
    driver: bridge
volumes:
  postgres_data: